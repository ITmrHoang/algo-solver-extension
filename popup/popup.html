<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#a78bfa" />
              <stop offset="1" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Algo Solver</span>
      </div>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <!-- Settings Panel (hidden by default) -->
    <section id="settings-panel" class="panel">
      <div class="field">
        <label for="api-key">Google AI Studio API Key</label>
        <div class="input-row">
          <input type="password" id="api-key" placeholder="AIza..." autocomplete="off">
          <button id="toggle-key" class="icon-btn small" title="Show/hide">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="language-select">Output Language</label>
        <select id="language-select">
          <option value="Python" selected>Python</option>
          <option value="JavaScript">JavaScript</option>
          <option value="TypeScript">TypeScript</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="C#">C#</option>
          <option value="Rust">Rust</option>
          <option value="Go">Go</option>
          <option value="Kotlin">Kotlin</option>
          <option value="Swift">Swift</option>
          <option value="Dart">Dart</option>
          <option value="Ruby">Ruby</option>
          <option value="PHP">PHP</option>
        </select>
      </div>

      <div class="field">
        <label for="model-select">Model</label>
        <select id="model-select">
          <optgroup label="Gemini 3 Series">
            <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
            <option value="gemini-3.1-flash-lite" selected>Gemini 3.1 Flash Lite ⚡ (Mặc định)</option>
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
            <option value="gemini-flash-lite-latest">Gemini Flash-Lite Latest (Tự động bản mới nhất)</option>
          </optgroup>
          <optgroup label="Gemma Open Models">
            <option value="gemma-4-26b-a4b-it">Gemma 4 26B A4B IT</option>
            <option value="gemma-4-31b-it">Gemma 4 31B IT</option>
          </optgroup>
        </select>
      </div>

      <button id="btn-save" class="btn primary">Save Settings</button>
    </section>

    <!-- Main Panel -->
    <section id="main-panel" class="panel">
      <!-- Input Area (Tự động nhận diện bài toán hoặc code lỗi/tối ưu) -->
      <div class="input-area">
        <textarea id="input-text" placeholder="Dán đề bài giải thuật, đoạn code lỗi cần fix, hoặc code cần tối ưu..."
          rows="6"></textarea>
        <div class="input-footer">
          <span id="char-count" class="meta">0 chars</span>
          <button id="btn-send" class="btn primary send-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            Send
          </button>
        </div>
      </div>

      <!-- Result Area -->
      <div id="result-area" class="result-area hidden">
        <div class="result-header">
          <span class="result-label">Result</span>
          <div class="result-actions">
            <span id="cache-badge" class="badge hidden">cached</span>
            <button id="btn-copy" class="icon-btn small" title="Copy again">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
          </div>
        </div>
        <pre id="result-text" class="result-code"></pre>
      </div>

      <!-- Error Area -->
      <div id="error-area" class="error-area hidden">
        <span id="error-text"></span>
      </div>

      <!-- Loading Spinner -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Processing...</span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="shortcut-hint">
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> — Trong Chrome: bôi đen text. Ngoài Chrome (VS Code...): Ctrl+C rồi
        bấm phím tắt
      </span>
    </footer>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
